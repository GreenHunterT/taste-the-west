<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#141210"/>
  <defs>
    <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0L0 0 0 60" fill="none" stroke="#1c1a16" stroke-width="1"/>
    </pattern>
    <radialGradient id="vg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1c18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" fill="url(#vg)"/>
  <!-- Corner marks -->
  <polyline points="100,50 50,50 50,100" fill="none" stroke="#c9a84c" stroke-width="2.5" opacity="0.4"/>
  <polyline points="1820,50 1870,50 1870,100" fill="none" stroke="#c9a84c" stroke-width="2.5" opacity="0.4"/>
  <polyline points="50,980 50,1030 100,1030" fill="none" stroke="#c9a84c" stroke-width="2.5" opacity="0.4"/>
  <polyline points="1870,980 1870,1030 1820,1030" fill="none" stroke="#c9a84c" stroke-width="2.5" opacity="0.4"/>
  <!-- Center icon: camera outline -->
  <g transform="translate(960 490)" fill="none" stroke="#c9a84c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <rect x="-48" y="-32" width="96" height="74" rx="10"/>
    <circle cx="0" cy="5" r="22"/>
    <rect x="-16" y="-42" width="32" height="14" rx="5"/>
  </g>
  <!-- EN text -->
  <text x="960" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#c9a84c" text-anchor="middle" letter-spacing="3" opacity="0.6">HERO PHOTO — RESTAURANT EXTERIOR / INTERIOR</text>
  <!-- AR text -->
  <text x="960" y="638" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="18" fill="#9a9585" text-anchor="middle" opacity="0.45">صورة الغلاف — استبدلها بصورة المطعم قبل الإطلاق</text>
  <!-- Size hint -->
  <text x="960" y="680" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#4a4840" text-anchor="middle" opacity="0.6">Recommended: 1920 × 1080 px  ·  Upload via Admin → Settings</text>
</svg>
