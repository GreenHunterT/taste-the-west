<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title data-i18n="login.docTitle">Admin Login — Taste The West</title>
  <link rel="stylesheet" href="css/admin.css" />
  <!-- Pre-paint Admin language bootstrap (1T.1) — keep synchronous, right after the stylesheet. -->
  <script src="js/i18n-boot.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>" />
</head>
<body>

  <main class="login-page" aria-labelledby="login-title">
    <div class="login-card">
      <!-- Admin interface language (1T) — same per-device preference as the shell. -->
      <div class="login-lang">
        <div class="admin-lang" role="group" aria-label="Admin interface language" data-i18n-aria-label="lang.groupAria">
          <button type="button" class="admin-lang__btn is-active" data-ui-lang="en" lang="en" aria-pressed="true"
                  title="English interface" data-i18n-title="lang.enTitle">EN</button>
          <button type="button" class="admin-lang__btn" data-ui-lang="ar" lang="ar" dir="rtl" aria-pressed="false"
                  title="Arabic interface" data-i18n-title="lang.arTitle">عربي</button>
        </div>
      </div>
      <div class="login-logo" aria-hidden="true">🍕</div>
      <h1 class="login-title" id="login-title">Taste The West</h1>
      <p class="login-sub" data-i18n="login.sub">Owner Dashboard — sign in to continue</p>

      <div class="login-error" id="login-error" hidden role="alert"></div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label for="email" data-i18n="login.email">Email address</label>
          <input type="email" id="email" name="email"
                 autocomplete="email" required
                 placeholder="owner@example.com" />
        </div>
        <div class="form-group">
          <label for="password" data-i18n="login.password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required
                 placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary login-btn" id="login-btn" data-i18n="login.submit">
          Sign in
        </button>
      </form>
    </div>
  </main>

  <!-- Pinned to the exact version resolved today (1O hardening) — see
       admin/index.html for why a floating @2 tag is avoided. -->
  <!-- i18n.js first (1T.1): a local file, so the pre-paint hide ends before the
       network CDN script below is even requested. It only needs the DOM. -->
  <script src="js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="../config/supabase.js"></script>
  <script src="js/client.js"></script>
  <script>
    (async function () {
      // Already signed in → go straight to the persistent Admin shell.
      const { data: { session } } = await db.auth.getSession();
      if (session) { window.location.replace('/admin/#menu'); return; }

      const form     = document.getElementById('login-form');
      const emailEl  = document.getElementById('email');
      const passEl   = document.getElementById('password');
      const btn      = document.getElementById('login-btn');
      const errorEl  = document.getElementById('login-error');

      const I18N = window.AdminI18n;
      // Stamped by key, so an Admin language switch re-labels a visible error.
      function setError(key) {
        I18N.set(errorEl, key);
        errorEl.hidden = false;
      }
      function clearError() { errorEl.hidden = true; }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email    = emailEl.value.trim();
        const password = passEl.value;

        if (!email || !password) { setError('login.missing'); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span> ';
        I18N.set(btn, 'login.signingIn');

        const { data, error } = await db.auth.signInWithPassword({ email, password });

        if (error) {
          btn.disabled = false;
          btn.textContent = '';
          I18N.set(btn, 'login.submit');
          // Show generic message — do not leak whether email exists
          setError('login.invalid');
          return;
        }

        window.location.replace('/admin/#menu');
      });
    })();
  </script>
</body>
</html>
