<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Taste The West</title>
  <link rel="stylesheet" href="css/admin.css" />
  <!-- Fonts used by the public Homepage Statistics component, loaded so the
       shell Live Preview mirrors its real typography. Falls back otherwise. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>" />
</head>
<body data-admin-shell>

  <div class="admin-layout">

    <!-- Top app bar (ONE copy — owned by the shell). Brand · primary nav ·
         utility actions. Replaces the former full-height sidebar now that there
         are only two destinations. -->
    <header class="admin-appbar" id="admin-appbar">
      <div class="admin-appbar__brand">
        <span class="admin-appbar__mark" aria-hidden="true">🍕</span>
        <span class="admin-appbar__name" id="admin-brand-name">Taste The West</span>
      </div>
      <nav class="admin-appbar__nav" aria-label="Admin sections">
        <a href="#menu" class="admin-navlink" data-route="menu">Menu</a>
        <a href="#settings" class="admin-navlink" data-route="settings">Settings</a>
      </nav>
      <div class="admin-appbar__actions">
        <a href="../index.html" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm">View Site</a>
        <button type="button" class="btn btn-ghost btn-sm" data-logout>Sign Out</button>
      </div>
    </header>

    <!-- Shell content: fail-closed banner + narrow Edit|Preview bar + editor | persistent preview -->
    <div class="admin-shell__main" id="admin-shell-main" data-pane="edit">

      <div class="settings-load-error admin-shell__banner" id="admin-shell-banner" role="alert" hidden>
        Restaurant settings could not be loaded. Reload the page before making changes.
      </div>

      <div class="admin-shell__modebar">
        <div class="lp-seg" role="group" aria-label="Admin view" id="admin-pane-seg">
          <button type="button" class="lp-seg__btn is-active" data-pane="edit" aria-pressed="true">Edit</button>
          <button type="button" class="lp-seg__btn" data-pane="preview" aria-pressed="false">Preview</button>
        </div>
      </div>

      <main class="admin-shell__editor" id="admin-view">
        <!-- the active editor view mounts here -->
      </main>

      <aside class="admin-shell__preview">
        <div class="live-preview" id="live-preview">
          <div class="live-preview__head">
            <h2 class="live-preview__title">Live Preview</h2>
            <span class="live-preview__hint">Shows your saved public site.</span>
          </div>

          <div class="live-preview__controls">
            <div class="lp-group">
              <span class="lp-group__label" id="lp-lbl-page">Page</span>
              <div class="lp-seg" role="group" aria-labelledby="lp-lbl-page">
                <button type="button" class="lp-seg__btn is-active" data-page="home" aria-pressed="true">Home</button>
                <button type="button" class="lp-seg__btn" data-page="menu" aria-pressed="false">Menu</button>
                <button type="button" class="lp-seg__btn" data-page="location" aria-pressed="false">Location</button>
                <button type="button" class="lp-seg__btn" data-page="contact" aria-pressed="false">Contact</button>
              </div>
            </div>
            <div class="lp-group">
              <span class="lp-group__label" id="lp-lbl-device">Device</span>
              <div class="lp-seg" role="group" aria-labelledby="lp-lbl-device">
                <button type="button" class="lp-seg__btn is-active" data-device="desktop" aria-pressed="true">Desktop</button>
                <button type="button" class="lp-seg__btn" data-device="mobile" aria-pressed="false">Mobile</button>
              </div>
            </div>
            <div class="lp-group">
              <span class="lp-group__label" id="lp-lbl-lang">Language</span>
              <div class="lp-seg" role="group" aria-labelledby="lp-lbl-lang">
                <button type="button" class="lp-seg__btn is-active" data-lang="en" aria-pressed="true">English</button>
                <button type="button" class="lp-seg__btn" data-lang="ar" aria-pressed="false" lang="ar">العربية</button>
              </div>
            </div>
            <div class="lp-group">
              <span class="lp-group__label" id="lp-lbl-theme">Theme</span>
              <div class="lp-seg" role="group" aria-labelledby="lp-lbl-theme">
                <button type="button" class="lp-seg__btn is-active" data-theme="dark" aria-pressed="true">Dark</button>
                <button type="button" class="lp-seg__btn" data-theme="light" aria-pressed="false">Light</button>
              </div>
            </div>
            <div class="lp-group">
              <span class="lp-group__label" id="lp-lbl-view">View</span>
              <div class="lp-seg" role="group" aria-labelledby="lp-lbl-view">
                <button type="button" class="lp-seg__btn is-active" data-zoom="fit" aria-pressed="true">Fit</button>
                <button type="button" class="lp-seg__btn" data-zoom="100" aria-pressed="false">100%</button>
              </div>
            </div>
          </div>

          <div class="live-preview__stage" id="lp-stage" data-device="desktop" data-zoom="fit" data-theme="dark">
            <div class="lp-viewport" id="lp-viewport">
              <!-- Double-buffered: only the .is-active frame is shown. src values
                   are set by live-preview.js so every load carries a navigation
                   generation (?previewNav=N). -->
              <iframe class="preview-frame" data-slot="a" title="Website preview"
                      referrerpolicy="same-origin"></iframe>
              <iframe class="preview-frame" data-slot="b" title="Website preview" aria-hidden="true"
                      referrerpolicy="same-origin"></iframe>
            </div>
          </div>
        </div>
      </aside>

    </div><!-- /.admin-shell__main -->

  </div><!-- /.admin-layout -->

  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <div class="admin-loading" id="admin-loading" hidden><div class="spinner"></div></div>

  <!-- Shell-owned unsaved-changes confirmation (ONE instance). Used for in-app
       navigation only — route change, Menu subsection change, browser
       Back/Forward, and Sign Out. Reload / close-tab stays on the browser's
       native beforeunload prompt (which cannot be styled). -->
  <dialog class="admin-dialog" id="admin-dirty-dialog" aria-labelledby="admin-dirty-title">
    <form method="dialog" class="admin-dialog__inner">
      <h2 class="admin-dialog__title" id="admin-dirty-title">Unsaved changes</h2>
      <p class="admin-dialog__msg">You have unsaved changes. If you leave now, they will be discarded.</p>
      <div class="admin-dialog__actions">
        <button type="submit" value="stay" class="btn btn-secondary" data-dirty-stay>Stay</button>
        <button type="submit" value="discard" class="btn btn-danger" data-dirty-discard>Discard changes</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../config/supabase.js"></script>
  <script src="js/client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/live-preview.js"></script>
  <script src="js/views/menu.js"></script>
  <script src="js/views/categories.js"></script>
  <script src="js/views/menu-workspace.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/admin-shell.js"></script>
</body>
</html>
