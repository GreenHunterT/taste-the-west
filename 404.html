      <a href="index.html"    class="nav-link" data-t="nav.home">Home</a>
      <a href="products.html" class="nav-link" data-t="nav.products">Menu</a>
      <a href="location.html" class="nav-link" data-t="nav.location">Location</a>
      <a href="contact.html"  class="nav-link" data-t="nav.contact">Contact</a>
      <div class="mobile-lang" role="group" aria-label="Language / اللغة">

        <span class="lang-sep" aria-hidden="true">·</span>
        <button class="lang-btn" data-lang="ar" lang="ar">عربية</button>
      </div>
    </nav>

      <p class="error-desc">
        Looks like this page wandered off — even the best pizza gets lost sometimes.<br />
        <span lang="ar" style="display:block;margin-top:6px;">يبدو أن هذه الصفحة ضاعت — لكن لا تقلق، القائمة في انتظارك.</span>
      </p>

      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>

        <a href="products.html" class="btn btn-outline">
